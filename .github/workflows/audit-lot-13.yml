name: Audit du lot 13
on:
  push:
    branches: [lot-13]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Audit serveur et fichiers
        run: |
          node outils/verif.mjs --captures="$RUNNER_TEMP/captures" > "$RUNNER_TEMP/audit-serveur.txt" 2>&1 || true
          node outils/verif.mjs --file > "$RUNNER_TEMP/audit-file.txt" 2>&1 || true
          cat "$RUNNER_TEMP/audit-serveur.txt" "$RUNNER_TEMP/audit-file.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-lot-13
          path: |
            ${{ runner.temp }}/audit-serveur.txt
            ${{ runner.temp }}/audit-file.txt
            ${{ runner.temp }}/captures
